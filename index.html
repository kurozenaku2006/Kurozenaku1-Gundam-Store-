<!DOCTYPE html>
<html>
<head>
<title>Kurozenaku Store</title>

<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

<link rel="icon" href="data:,">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body class="bg-gradient-to-b from-black via-gray-900 to-black text-white min-h-screen">

<div x-data="app()" x-init="init()" class="p-6 max-w-7xl mx-auto">

<!-- HEADER -->
<div class="flex justify-between items-center mb-6">
<h1 class="text-3xl font-bold">KUROZENAKU</h1>
<button @click="menuOpen=true" class="bg-white/10 px-3 py-2 rounded">☰ Menu</button>
</div>

<!-- SEARCH + FILTER -->
<div class="flex gap-2 mb-4">
<button @click="filterOpen=true" class="bg-white/10 px-3 rounded">☰</button>
<input x-model="search" class="flex-1 p-2 text-black rounded"/>
</div>

<!-- FILTER DRAWER -->
<div x-show="filterOpen" class="fixed top-0 left-0 h-full w-60 bg-gray-900 z-50 p-4">
<template x-for="c in ['ALL','HG','MG','PG','EG','RG','SD']">
<button @click="category=c; filterOpen=false"
class="block w-full mb-2 bg-white/10 px-3 py-2 rounded"
x-text="c"></button>
</template>
<button @click="filterOpen=false" class="bg-red-500 w-full py-2">Close</button>
</div>

<!-- PRODUCTS -->
<div x-show="view==='shop'" class="grid grid-cols-2 md:grid-cols-4 gap-4">
<template x-for="p in filteredProducts()" :key="p.id">
<div class="bg-white/10 p-3 rounded">
<img :src="p.image" class="h-40 w-full object-contain">
<h2 x-text="p.name"></h2>
<p>₹<span x-text="p.price"></span></p>

<button @click="addToCart(p)" class="bg-yellow-400 w-full mt-2 py-1 text-black">Cart</button>
</div>
</template>
</div>

<!-- CART -->
<div x-show="view==='cart'">
<h2 class="text-xl mb-4">Cart</h2>

<template x-for="item in cart">
<div class="flex justify-between border-b py-2">
<span x-text="item.name"></span>
<div>
<button @click="item.qty++">+</button>
<span x-text="item.qty"></span>
<button @click="item.qty--">-</button>
</div>
</div>
</template>

<p>Total: ₹<span x-text="total()"></span></p>

<button @click="checkout()" class="bg-green-500 w-full mt-4 py-2">
Checkout
</button>
</div>

<!-- ADMIN -->
<div x-show="view==='admin'" class="bg-white/10 p-4 rounded">

<h2 class="text-xl mb-4">Admin Panel</h2>

<p>Total Revenue: ₹<span x-text="revenue"></span></p>

<template x-for="o in adminOrders">
<div class="bg-black/30 p-3 mt-2 rounded">
<p>ID: <span x-text="o.id"></span></p>
<p>₹<span x-text="o.amount"></span></p>
<p x-text="o.status"></p>
</div>
</template>

</div>

<!-- MENU -->
<div x-show="menuOpen" @click="menuOpen=false"
class="fixed inset-0 bg-black/60 z-40"></div>

<div x-show="menuOpen"
class="fixed right-0 top-0 h-full w-72 bg-gray-900 z-50 p-5">

<button @click="go('shop')">Shop</button>
<button @click="go('cart')">Cart</button>
<button @click="go('admin')">Admin</button>

<button @click="login()" class="mt-4 bg-blue-500 w-full py-2">
Login
</button>

</div>

</div>

<script>
document.addEventListener('alpine:init', () => {
Alpine.data('app', () => ({

menuOpen:false,
filterOpen:false,
view:'shop',

products:[],
cart:[],
adminOrders:[],
revenue:0,

search:'',
category:'ALL',
user:null,

API_URL:"https://kurozenaku-gundam-store.onrender.com",

init(){
firebase.initializeApp({
apiKey:"YOUR_KEY",
authDomain:"YOUR_DOMAIN",
projectId:"YOUR_ID"
});

firebase.auth().onAuthStateChanged(u=>this.user=u);

firebase.firestore().collection("products").onSnapshot(s=>{
this.products=s.docs.map(d=>({id:d.id,...d.data()}));
});
},

login(){
firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
},

go(v){
this.view=v;
this.menuOpen=false;

if(v==="admin") this.loadAdmin();
},

filteredProducts(){
return this.products.filter(p=>
(p.name||'').toLowerCase().includes(this.search.toLowerCase()) &&
(this.category==='ALL'||p.category===this.category)
);
},

addToCart(p){
let i=this.cart.find(x=>x.id===p.id);
if(i)i.qty++; else this.cart.push({...p,qty:1});
},

total(){
return this.cart.reduce((t,i)=>t+i.price*i.qty,0);
},

async loadAdmin(){
const token = await firebase.auth().currentUser.getIdToken();

const res = await fetch(this.API_URL+"/admin/orders",{
headers:{Authorization:"Bearer "+token}
});

const data = await res.json();

this.adminOrders=data;

this.revenue=data
.filter(o=>o.status==="PAID")
.reduce((s,o)=>s+o.amount,0);
},

async checkout(){

if(!this.user){ alert("Login first"); return; }

const token = await firebase.auth().currentUser.getIdToken(true);

const orderRes = await fetch(this.API_URL+"/create-order",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+token
},
body:JSON.stringify({
amount:this.total(),
items:this.cart
})
});

const order = await orderRes.json();

const self=this;

new Razorpay({
key:"rzp_test_SenYF5dCaOG8Ab",
amount:order.amount,
currency:"INR",
order_id:order.id,

handler: async function(res){

const verify = await fetch(self.API_URL+"/verify",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+token
},
body:JSON.stringify(res)
});

const result = await verify.json();

if(result.success){
alert("Payment success");
self.cart=[];
}
}

}).open();

}

}))
})
</script>

</body>
</html>
