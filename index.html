<!DOCTYPE html>
<html>
<head>
<title>Kurozenaku Store</title>

<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

<link rel="icon" href="data:,">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body class="bg-gradient-to-b from-black via-gray-900 to-black text-white min-h-screen">

<div x-data="app()" x-init="init()" class="p-6 max-w-7xl mx-auto">

<!-- HEADER -->
<div class="flex justify-between items-center mb-6">
<h1 class="text-3xl font-bold">KUROZENAKU</h1>
<button @click="menuOpen=true" class="bg-white/10 px-3 py-2 rounded">☰ Menu</button>
</div>

<!-- SEARCH -->
<div class="flex gap-2 mb-4">
<input x-model="search" placeholder="Search Gundam kits..." class="flex-1 p-2 text-black rounded"/>
</div>

<!-- PRODUCTS -->
<div x-show="view==='shop'" class="grid grid-cols-2 md:grid-cols-4 gap-4">
<template x-for="p in filteredProducts()" :key="p.id">
<div class="bg-white/10 p-3 rounded">
<img :src="p.image" class="h-40 w-full object-contain">
<h2 x-text="p.name"></h2>
<p>₹<span x-text="p.price"></span></p>

<button @click="addToCart(p)" class="bg-yellow-400 text-black w-full mt-2 py-1">Cart</button>
</div>
</template>
</div>

<!-- CART -->
<div x-show="view==='cart'">
<h2 class="text-xl mb-4">Cart</h2>

<template x-for="item in cart">
<div class="flex justify-between border-b py-2">
<span x-text="item.name"></span>
<div>
<button @click="item.qty++">+</button>
<span x-text="item.qty"></span>
<button @click="item.qty--">-</button>
</div>
</div>
</template>

<p>Total: ₹<span x-text="total()"></span></p>

<button @click="checkout()" class="bg-green-500 w-full mt-4 py-2 rounded">
Checkout
</button>
</div>

<!-- ORDERS -->
<div x-show="view==='orders'">
<h2 class="text-xl mb-4">Orders</h2>

<template x-for="o in orders">
<div class="bg-white/10 p-3 mb-2 rounded">
<p>₹<span x-text="o.amount"></span></p>
<p>Status: <span x-text="o.status"></span></p>
</div>
</template>
</div>

<!-- ADMIN -->
<div x-show="view==='admin'" class="bg-white/10 p-4 rounded">

<h2 class="text-xl mb-4">Admin Panel</h2>

<div class="mb-4">
<h3>Total Revenue</h3>
<p class="text-2xl font-bold">₹<span x-text="revenue"></span></p>
</div>

<template x-for="o in adminOrders">
<div class="bg-black/30 p-3 mb-2 rounded">
<p>ID: <span x-text="o.id"></span></p>
<p>₹<span x-text="o.amount"></span></p>
<p>Status: <span x-text="o.status"></span></p>
<p>User: <span x-text="o.email"></span></p>
</div>
</template>

</div>

</div>

<script>
document.addEventListener('alpine:init', () => {
Alpine.data('app', () => ({

view:'shop',
products:[],
cart:[],
orders:[],
adminOrders:[],
revenue:0,

search:'',
user:null,

API_URL:"https://kurozenaku-gundam-store.onrender.com",

init(){
firebase.initializeApp({
apiKey:"YOUR_KEY",
authDomain:"YOUR_DOMAIN",
projectId:"YOUR_ID"
});

fetch(this.API_URL).catch(()=>{});

firebase.auth().onAuthStateChanged(async u=>{
this.user=u;
if(u){
await this.loadOrders();
}
});

firebase.firestore().collection("products").onSnapshot(s=>{
this.products=s.docs.map(d=>({id:d.id,...d.data()}));
});
},

login(){
firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
},

async loadOrders(){
const snap = await firebase.firestore()
.collection("orders")
.where("userId","==",this.user.uid)
.get();

this.orders = snap.docs.map(d=>d.data());
},

async loadAdmin(){
const token = await firebase.auth().currentUser.getIdToken();

const res = await fetch(this.API_URL+"/admin/orders",{
headers:{ "Authorization":"Bearer "+token }
});

const data = await res.json();

this.adminOrders = data;

this.revenue = data
.filter(o=>o.status==="PAID")
.reduce((s,o)=>s+o.amount,0);
},

filteredProducts(){
return this.products.filter(p=>
(p.name||'').toLowerCase().includes(this.search.toLowerCase())
);
},

addToCart(p){
let i=this.cart.find(x=>x.id===p.id);
if(i)i.qty++; else this.cart.push({...p,qty:1});
},

total(){
return this.cart.reduce((t,i)=>t+i.price*i.qty,0);
},

go(v){
this.view=v;
if(v==="admin") this.loadAdmin();
},

async checkout(){

if(!this.user){ alert("Login first"); return; }

const token = await firebase.auth().currentUser.getIdToken(true);

const orderRes = await fetch(this.API_URL+"/create-order",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+token
},
body:JSON.stringify({
amount:this.total(),
items:this.cart
})
});

const order = await orderRes.json();

const self=this;

new Razorpay({
key:"rzp_test_SiYEspp96mmcT5",
amount:order.amount,
currency:"INR",
order_id:order.id,

handler: async function(res){

const verify = await fetch(self.API_URL+"/verify",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+token
},
body:JSON.stringify(res)
});

const result = await verify.json();

if(result.success){
alert("Payment success");
self.cart=[];
self.loadOrders();
}
}

}).open();

}

}))
})
</script>

</body>
</html>
